<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Cleanator: a disk seen as a treemap, one tile cleared. Palette = the app's rule categories. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b2f3a"/>
      <stop offset="1" stop-color="#171a22"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <!-- tiles -->
  <rect x="40" y="40" width="98" height="120" rx="12" fill="#9085e9"/>
  <rect x="148" y="40" width="68" height="60" rx="12" fill="#eda100"/>
  <rect x="148" y="110" width="68" height="50" rx="12" fill="#3987e5"/>
  <rect x="40" y="170" width="60" height="46" rx="12" fill="#1baf7a"/>
  <!-- the cleared tile: outline only, with a check -->
  <rect x="110" y="170" width="106" height="46" rx="12" fill="none" stroke="#e6e8ef" stroke-width="5" stroke-dasharray="10 8"/>
  <path d="M146 193 l11 11 l22 -24" fill="none" stroke="#e6e8ef" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
