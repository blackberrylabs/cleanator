[package]
name = "cleanator"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Disk cleaner for developers who run AI on Linux — never deletes anything"

[[bin]]
name = "cleanator"
path = "src/main.rs"

[dependencies]
cleanator-core = { path = "../core" }
iced = { version = "=0.13.1", features = ["canvas", "advanced", "tokio", "image"] }
serde_json.workspace = true
serde.workspace = true

# ---------------------------------------------------------------- packaging
# `packaging/build.sh` builds the workspace once, then runs `cargo deb --no-build` and
# `cargo generate-rpm` from here, so one package ships both binaries.

[package.metadata.deb]
name = "cleanator"
maintainer = "Alexandre Do <alexandre@blackberrylabs.dev>"
copyright = "2026, Alexandre Do"
license-file = ["../../LICENSE", "0"]
extended-description = """\
Cleanator shows where a developer's disk went (models, Python environments, Docker, \
package caches, AI assistants' histories), classifies what can go as safe / review / \
never, and writes a shell script you read and run yourself. It never deletes anything. \
Ships the desktop app (cleanator) and the command-line core (cleanator-cli)."""
section = "utils"
priority = "optional"
# Window-system libraries are loaded at runtime (dlopen), so they are not seen by
# dpkg-shlibdeps; Vulkan is only recommended: iced falls back to software rendering.
depends = "$auto, libxkbcommon0, libwayland-client0 | libx11-6"
recommends = "libvulkan1, mesa-vulkan-drivers"
assets = [
    ["target/release/cleanator", "usr/bin/", "755"],
    ["target/release/cleanator-cli", "usr/bin/", "755"],
    ["../../assets/cleanator.desktop", "usr/share/applications/", "644"],
    ["../../assets/icon.svg", "usr/share/icons/hicolor/scalable/apps/cleanator.svg", "644"],
    ["../../assets/icon-16.png", "usr/share/icons/hicolor/16x16/apps/cleanator.png", "644"],
    ["../../assets/icon-32.png", "usr/share/icons/hicolor/32x32/apps/cleanator.png", "644"],
    ["../../assets/icon-48.png", "usr/share/icons/hicolor/48x48/apps/cleanator.png", "644"],
    ["../../assets/icon-64.png", "usr/share/icons/hicolor/64x64/apps/cleanator.png", "644"],
    ["../../assets/icon-128.png", "usr/share/icons/hicolor/128x128/apps/cleanator.png", "644"],
    ["../../assets/icon-256.png", "usr/share/icons/hicolor/256x256/apps/cleanator.png", "644"],
    ["../../assets/icon-512.png", "usr/share/icons/hicolor/512x512/apps/cleanator.png", "644"],
    ["../../README.md", "usr/share/doc/cleanator/README.md", "644"],
]

[package.metadata.generate-rpm]
name = "cleanator"
summary = "Disk cleaner for developers who run AI on Linux — never deletes anything"
license = "MIT"
url = "https://github.com/blackberrylabs/cleanator"
# Same runtime story as the .deb; names per Fedora.
requires = { libxkbcommon = "*" }
assets = [
    { source = "target/release/cleanator", dest = "/usr/bin/cleanator", mode = "755" },
    { source = "target/release/cleanator-cli", dest = "/usr/bin/cleanator-cli", mode = "755" },
    { source = "assets/cleanator.desktop", dest = "/usr/share/applications/cleanator.desktop", mode = "644" },
    { source = "assets/icon.svg", dest = "/usr/share/icons/hicolor/scalable/apps/cleanator.svg", mode = "644" },
    { source = "assets/icon-16.png", dest = "/usr/share/icons/hicolor/16x16/apps/cleanator.png", mode = "644" },
    { source = "assets/icon-32.png", dest = "/usr/share/icons/hicolor/32x32/apps/cleanator.png", mode = "644" },
    { source = "assets/icon-48.png", dest = "/usr/share/icons/hicolor/48x48/apps/cleanator.png", mode = "644" },
    { source = "assets/icon-64.png", dest = "/usr/share/icons/hicolor/64x64/apps/cleanator.png", mode = "644" },
    { source = "assets/icon-128.png", dest = "/usr/share/icons/hicolor/128x128/apps/cleanator.png", mode = "644" },
    { source = "assets/icon-256.png", dest = "/usr/share/icons/hicolor/256x256/apps/cleanator.png", mode = "644" },
    { source = "assets/icon-512.png", dest = "/usr/share/icons/hicolor/512x512/apps/cleanator.png", mode = "644" },
    { source = "README.md", dest = "/usr/share/doc/cleanator/README.md", mode = "644", doc = true },
    { source = "LICENSE", dest = "/usr/share/licenses/cleanator/LICENSE", mode = "644", doc = true },
]
