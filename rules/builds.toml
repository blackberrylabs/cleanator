# Build outputs and dependency folders inside projects. `safe` when the project is dormant
# (no file modified outside build folders for dormancy_days), `review` with the rebuild
# cost when the project is active. Attributed to the parent project so the UI can say
# "12 dormant projects, 38 GB regenerable".
schema = 1

[[rule]]
id = "node-modules"
name = "node_modules"
category = "build"
level = "safe"
[rule.detect]
kind = "pattern"
glob = "**/node_modules"
anchor = "project"
requires_sibling = ["package.json"]
exclude_under = ["docker/volumes", "node_modules/", ".npm/", ".vscode/extensions", ".cursor/extensions", ".windsurf/extensions", ".cache/"]
[rule.cleanup]
kind = "rm"
requires = "user"
[rule.conditions]
dormancy_days = 60
active_project_level = "review"
[rule.explain]
why = "Installed JavaScript dependencies of one project, fully described by package.json and its lock file."
regenerate = "`npm install` / `pnpm install` / `yarn` / `bun install` in the project."
cost = "seconds to minutes, network (less with the package cache kept)"
notes = "Only top-level node_modules next to a package.json are listed; nested ones are part of them."
[rule.in_use]
processes = ["node", "vite", "next", "tsc"]
[rule.source]
url = "https://docs.npmjs.com/cli/v10/commands/npm-cache"
read_on = 2026-10-15
quote = "npm may need to refetch packages later"

[[rule]]
id = "cargo-target"
name = "Rust build directory (target/)"
category = "build"
level = "safe"
[rule.detect]
kind = "pattern"
glob = "**/target"
anchor = "project"
requires_sibling = ["Cargo.toml"]
marker = "CACHEDIR.TAG"
[rule.cleanup]
kind = "command"
command = "cargo clean --manifest-path {project}/Cargo.toml"
fallback = "rm"
requires = "user"
[rule.conditions]
dormancy_days = 60
active_project_level = "review"
[rule.explain]
why = "Compiled artifacts of a Rust project (debug and release). Tauri projects easily reach 5 to 20 GB per target/ because every dependency is compiled locally."
regenerate = "The next `cargo build` recompiles everything: a full rebuild of a Tauri app takes several minutes."
cost = "minutes of CPU per rebuild; no network if the registry cache is kept"
notes = "Cargo writes a CACHEDIR.TAG file in target/, which is how Cleanator tells a Rust target/ from any other folder named target. For an active project the recommendation shows the rebuild cost and stays unticked by default."
[rule.in_use]
processes = ["cargo", "rustc", "rust-analyzer"]
[rule.source]
url = "https://doc.rust-lang.org/cargo/guide/cargo-home.html"
read_on = 2026-10-15
quote = "Cargo will do its best to restore sources if a crate needs them"

[[rule]]
id = "web-build-outputs"
name = "Web build outputs (.next, dist, .turbo, .open-next, .nuxt, .svelte-kit, .parcel-cache, .astro)"
category = "build"
level = "safe"
[rule.detect]
kind = "pattern"
glob = ["**/.next", "**/dist", "**/.turbo", "**/.open-next", "**/.nuxt", "**/.svelte-kit", "**/.parcel-cache", "**/.astro", "**/.vite", "**/.cache"]
anchor = "project"
requires_sibling = ["package.json"]
exclude_under = ["node_modules/", "docker/volumes", ".npm/", ".vscode/extensions", ".cursor/extensions", ".windsurf/extensions", ".cache/"]
[rule.cleanup]
kind = "rm"
requires = "user"
[rule.conditions]
dormancy_days = 60
active_project_level = "review"
[rule.explain]
why = "Compiled output and framework caches of a JavaScript project, produced by `npm run build` / `dev`."
regenerate = "The next build recreates them."
cost = "seconds to minutes of CPU"
notes = "`dist/` and `.cache/` are only matched next to a package.json: anywhere else they may be data."
[rule.in_use]
processes = ["node", "vite", "next"]
[rule.source]
url = "project brief, inventory of 2026-10-15"
read_on = 2026-10-15
quote = "Geoclimat/06_site/dist 2.9 GB, Openorhold .next 373 MB"

[[rule]]
id = "python-caches-in-projects"
name = "Python caches in projects (__pycache__, .pytest_cache, .mypy_cache, .ruff_cache)"
category = "build"
level = "safe"
[rule.detect]
kind = "pattern"
glob = ["**/__pycache__", "**/.pytest_cache", "**/.mypy_cache", "**/.ruff_cache", "**/.hypothesis"]
anchor = "project"
exclude_under = [".venv/", "venv/", "site-packages/", "docker/volumes"]
[rule.cleanup]
kind = "rm"
requires = "user"
[rule.conditions]
dormancy_days = 60
active_project_level = "safe"
[rule.explain]
why = "Bytecode and tool caches Python and its linters/testers write next to the code."
regenerate = "Recreated on the next run."
cost = "none"
notes = "`build/` is deliberately not matched: next to a pyproject it may be packaging output, elsewhere it is often data (seen on the dev machine: a 485 MB `build/` of a legal corpus). Unknown is `never` (R2)."
[rule.source]
url = "https://docs.python.org/3/library/venv.html"
read_on = 2026-10-15
quote = "(bytecode caches are regenerated by the interpreter; no dedicated source — to add from the Python docs on __pycache__ before release)"

[[rule]]
id = "aider-caches"
name = "Aider tag caches"
category = "assistant-cache"
level = "safe"
[rule.detect]
kind = "pattern"
glob = "**/.aider.tags.cache.*"
anchor = "project"
[rule.cleanup]
kind = "rm"
requires = "user"
[rule.explain]
why = "Repository map cache Aider builds per project."
regenerate = "Rebuilt on the next aider run."
cost = "seconds"
notes = "History files are documented (and matched by the assistant-history rules); the .aider.tags.cache.* directory (repo map cache, rebuilt per --map-refresh) is observed, not documented."
[rule.in_use]
processes = ["aider"]
[rule.source]
url = "https://aider.chat/docs/config/options.html"
read_on = 2026-10-15
quote = "--chat-history-file: Specify the chat history file (default: .aider.chat.history.md); --input-history-file (default: .aider.input.history)"
